# Prefix: Ctrl+Space (Omarchy)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on
setw -g mode-keys vi

# Splits keep the current directory
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind x kill-pane
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Alt+arrows move between panes, no prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Vi copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Status bar — Gruvbox
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#282828,fg=#d4be98"
set -g status-left "#[fg=#282828,bg=#7daea3,bold] #S #[bg=#282828] "
set -g status-left-length 30
set -g status-right "#[fg=#7c6f64]#{?client_prefix,#[fg=#d8a657]PREFIX ,}%H:%M "
setw -g window-status-format "#[fg=#7c6f64] #I:#W "
setw -g window-status-current-format "#[fg=#7daea3,bold] #I:#W "
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#7daea3"
set -g message-style "bg=#282828,fg=#7daea3"
